<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>牛马加油器</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB8A3C"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7C2D12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS 图标底板：824×824 圆角方块，四周留 100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- 底部速度线：加油 -->
  <g stroke="#FFEDD5" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round">
    <path d="M220 790 H310"/>
    <path d="M250 834 H320"/>
    <path d="M714 790 H804"/>
    <path d="M704 834 H774"/>
  </g>

  <g filter="url(#soft)">
    <!-- 牛角 -->
    <path d="M410 372 C330 366 262 318 248 214 C292 278 356 308 428 318 Z" fill="#FFF1E0"/>
    <path d="M614 372 C694 366 762 318 776 214 C732 278 668 308 596 318 Z" fill="#FFF1E0"/>
    <!-- 耳朵 -->
    <ellipse cx="318" cy="432" rx="78" ry="36" transform="rotate(-18 318 432)" fill="#FFE4CC"/>
    <ellipse cx="706" cy="432" rx="78" ry="36" transform="rotate(18 706 432)" fill="#FFE4CC"/>
    <!-- 脸 -->
    <path d="M512 318 C646 318 706 352 706 436 C706 526 676 606 646 652 L378 652 C348 606 318 526 318 436 C318 352 378 318 512 318 Z" fill="#FFF7ED"/>
    <!-- 鼻子 -->
    <ellipse cx="512" cy="664" rx="156" ry="102" fill="#FDBA74"/>
    <ellipse cx="458" cy="668" rx="20" ry="27" fill="#9A3412"/>
    <ellipse cx="566" cy="668" rx="20" ry="27" fill="#9A3412"/>
  </g>

  <!-- 眼睛和眉毛：有点累，但很坚定 -->
  <g stroke="#431407" stroke-width="16" stroke-linecap="round">
    <path d="M404 470 L466 486"/>
    <path d="M620 470 L558 486"/>
  </g>
  <circle cx="440" cy="522" r="23" fill="#431407"/>
  <circle cx="584" cy="522" r="23" fill="#431407"/>
  <circle cx="447" cy="514" r="7" fill="#FFF7ED"/>
  <circle cx="591" cy="514" r="7" fill="#FFF7ED"/>

  <!-- 额头上的金币 -->
  <circle cx="512" cy="410" r="54" fill="url(#coin)" stroke="#B45309" stroke-width="8"/>
  <g stroke="#92400E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M488 380 L512 410 L536 380"/>
    <path d="M512 410 V444"/>
    <path d="M492 414 H532"/>
    <path d="M492 430 H532"/>
  </g>

  <!-- 汗珠：牛马的日常 -->
  <path d="M742 470 C758 500 770 518 770 536 A28 28 0 0 1 714 536 C714 518 726 500 742 470 Z"
        fill="#7DD3FC" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
</svg>
